<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif">
<rect width="900" height="430" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="220" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">① 주응력 요소 (전단 0)</text>
<rect x="150" y="155" width="140" height="140" fill="#e3f2fd" stroke="#222" stroke-width="2"/>
<line x1="290" y1="225" x2="370" y2="225" stroke="#1f5fbf" stroke-width="3" marker-end="url(#a)"/>
<line x1="150" y1="225" x2="70" y2="225" stroke="#1f5fbf" stroke-width="3" marker-end="url(#a)"/>
<text x="335" y="255" text-anchor="middle" font-size="16" fill="#1f5fbf">σ₁ = 50 (인장)</text>
<line x1="220" y1="85" x2="220" y2="155" stroke="#c62828" stroke-width="3" marker-end="url(#a)"/>
<line x1="220" y1="365" x2="220" y2="295" stroke="#c62828" stroke-width="3" marker-end="url(#a)"/>
<text x="232" y="115" font-size="16" fill="#c62828">σ₃ = −30 (압축)</text>
<text x="220" y="412" text-anchor="middle" font-size="14" fill="#222">σ₂ = 0 은 종이에 수직(면외) 방향</text>
<text x="640" y="40" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">② 45° 회전 요소 (최대 전단)</text>
<g transform="rotate(-45 640 225)">
<rect x="570" y="155" width="140" height="140" fill="#fff3e0" stroke="#222" stroke-width="2"/>
<line x1="728" y1="225" x2="765" y2="225" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="552" y1="225" x2="515" y2="225" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="640" y1="313" x2="640" y2="350" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="640" y1="137" x2="640" y2="100" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="720" y1="180" x2="720" y2="270" stroke="#c62828" stroke-width="3" marker-end="url(#a)"/>
<line x1="560" y1="270" x2="560" y2="180" stroke="#c62828" stroke-width="3" marker-end="url(#a)"/>
<line x1="685" y1="145" x2="595" y2="145" stroke="#c62828" stroke-width="3" marker-end="url(#a)"/>
<line x1="595" y1="305" x2="685" y2="305" stroke="#c62828" stroke-width="3" marker-end="url(#a)"/>
</g>
<text x="755" y="130" font-size="16" fill="#c62828" font-weight="bold">τ_max = 40</text>
<text x="755" y="335" font-size="16" fill="#2e7d32">σ = 10 (모든 면)</text>
<text x="640" y="412" text-anchor="middle" font-size="14" fill="#222">Mohr 원 위에서 2θ = 90° ↔ 실제 요소에서 θ = 45°</text>
</svg>